name: Publicar insights

on:
  # Agendamento desligado enquanto a aba Insights está "em breve".
  # Para religar, volte as duas linhas abaixo:
  # schedule:
  #   - cron: "5 10-23,0-2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publicar-insights
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar páginas dos estudos
        run: python coletor/gerar_insights.py

      - name: Gravar mudanças
        run: |
          git config user.name "publicador-insights"
          git config user.email "publicador-insights@users.noreply.github.com"
          git add -A insights dados/posts.json
          if git diff --cached --quiet; then
            echo "Sem mudanças nos estudos."
          else
            git commit -m "Insights atualizados em $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
            git pull --rebase --autostash
            git push
          fi
