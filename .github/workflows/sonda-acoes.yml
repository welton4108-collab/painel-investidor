name: Sonda ações (temporária)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          mkdir -p tmp_sonda
          python coletor/sonda_acoes.py > tmp_sonda/saida.txt 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp_sonda/saida.txt
          git commit -m "Saída da sonda" || exit 0
          git pull --rebase -q && git push -q
