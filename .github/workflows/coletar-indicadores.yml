name: Coletar indicadores

on:
  schedule:
    # Dias úteis às 14h30 de Brasília (17h30 UTC), depois da PTAX
    - cron: "30 17 * * 1-5"
    # Segunda às 10h30 de Brasília, logo depois do Boletim Focus
    - cron: "30 13 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: coletar-indicadores
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar coletor
        id: coleta
        env:
          SAIDA_DADOS: dados
          # Opcional: chave gratuita da API do FRED (Settings > Secrets > Actions)
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if python coletor/coletor_v1.py; then
            echo "falhou=0" >> "$GITHUB_OUTPUT"
          else
            echo "falhou=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Gravar dados novos
        run: |
          git config user.name "coletor-indicadores"
          git config user.email "coletor-indicadores@users.noreply.github.com"
          git add dados/indicadores.json
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados."
          else
            git commit -m "Dados atualizados em $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
            git push
          fi

      - name: Avisar se alguma fonte falhou
        if: steps.coleta.outputs.falhou == '1'
        run: |
          echo "::error::Uma ou mais fontes falharam. O site mantém o último dado válido dessas fontes."
          exit 1
